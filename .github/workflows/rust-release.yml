name: Pre3 Windows distribution recovery
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 21b4454fe744c6f0ba662c50a5c3b5a8c7aa4985
      - name: Download the verified bundle from the pinned release build
        uses: actions/download-artifact@v4
        with:
          name: release-windows
          run-id: 39777433481
          github-token: ${{ github.token }}
          path: input
      - name: Inspect the verified bundle
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne '21b4454fe744c6f0ba662c50a5c3b5a8c7aa4985') { throw 'Release source mismatch' }
          Expand-Archive input/Meltype-flash-Windows-x64.zip -DestinationPath bundle
          ./bundle/Manage-Windows.ps1 -Action Inspect
      - name: Build Rust setup and portable distribution
        shell: pwsh
        run: |
          $version = (Get-Content Cargo.toml | Select-String '^version = "([^"]+)"').Matches.Groups[1].Value
          $iscc = 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) { throw 'Inno Setup is absent' }
          New-Item -ItemType Directory dist -Force | Out-Null
          & $iscc "/DAppVersion=$version" "/DSourceDir=$((Resolve-Path bundle).Path)" "/DOutputDir=$((Resolve-Path dist).Path)" packaging/Meltype-flash.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compile failed' }
          Copy-Item bundle portable -Recurse
          '@echo off' + "`r`n" + 'powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%~dp0Start-Portable.ps1" -Tray' + "`r`n" | Set-Content portable/Start-Portable.cmd -Encoding ascii
          $manifest = Get-Content portable/SHA256SUMS.json -Raw | ConvertFrom-Json -AsHashtable
          $manifest['Start-Portable.cmd'] = (Get-FileHash portable/Start-Portable.cmd -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest | ConvertTo-Json | Set-Content portable/SHA256SUMS.json -Encoding utf8
          ./portable/Manage-Windows.ps1 -Action Inspect
          Compress-Archive portable/* dist/Meltype-flash-Windows-portable.zip
          Copy-Item input/Meltype-flash-Windows-x64.zip dist/Meltype-flash-Windows.zip
      - name: Exercise actual installer and uninstaller
        shell: pwsh
        run: |
          $installer = (Get-ChildItem dist/*-setup.exe).FullName
          $result = Start-Process -FilePath $installer -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /LOG=setup.log' -WindowStyle Hidden -Wait -PassThru
          Get-Content setup.log -Tail 90
          Get-ChildItem 'C:/Program Files/Meltype-flash' -Recurse -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
          if ($result.ExitCode -ne 0) { throw "Setup failed: $($result.ExitCode)" }
          $state = Get-Content 'C:/Program Files/Meltype-flash/installed.json' -Raw | ConvertFrom-Json
          if (-not (Test-Path -LiteralPath $state.x64)) { throw 'Installed IME DLL missing' }
          $result = Start-Process -FilePath 'C:/Program Files/Meltype-flash/installer/unins000.exe' -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /LOG=uninstall.log' -WindowStyle Hidden -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Uninstall failed: $($result.ExitCode)" }
          $registered = Get-ItemProperty 'Registry::HKEY_LOCAL_MACHINE/SOFTWARE/Classes/CLSID/{C540BAF6-88B1-5B30-B524-2C8702B034FC}/InprocServer32' -ErrorAction SilentlyContinue
          if ($null -ne $registered) { throw 'Flash COM registration remains' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flash-windows-setup-logs
          path: |
            setup.log
            uninstall.log
      - uses: actions/upload-artifact@v4
        with:
          name: flash-distributions-windows
          path: dist/*
          if-no-files-found: error
