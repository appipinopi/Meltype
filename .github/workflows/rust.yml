name: Rust preview
on:
  workflow_dispatch:
  pull_request:
    paths: ['rust/**', 'android/**', 'Cargo.*', 'dictionaries/**', 'native/tip/**', 'linux/fcitx5/**', '.github/workflows/rust.yml']
permissions:
  contents: read
concurrency:
  group: rust-preview-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux IBus development and isolated-test runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libibus-1.0-dev ibus gir1.2-ibus-1.0 python3-gi dbus-x11 xvfb
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo run -p meltype-core --example quality -- quality-report.json --check
      - name: Build fcitx5 adapter
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libfcitx5core-dev libfcitx5utils-dev libfcitx5config-dev
          cmake -S linux/fcitx5 -B linux/build/fcitx5-rust
          cmake --build linux/build/fcitx5-rust --parallel 2
      - run: cargo build --workspace --release --locked
      - name: Rust IBus engine through a private daemon and input context
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a dbus-run-session -- /usr/bin/python3 rust/ibus/tests/integration.py target/release/meltype-ibus
          MELTYPE_IBUS_TEST_INSTALLED=1 xvfb-run -a dbus-run-session -- /usr/bin/python3 rust/ibus/tests/integration.py target/release/meltype-ibus
          /usr/bin/python3 rust/ibus/tests/installation.py target/release/meltype-ibus
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Native ABI callbacks and live conversion
        run: python rust/native/tests/abi_smoke.py
      - name: Settings UI labels match upstream
        run: python tools/extract-rust-settings-ui.py --check
      - name: Package standalone Rust IBus engine
        if: runner.os == 'Linux'
        run: bash rust/build-linux.sh
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: rust-IBus-Linux
          path: linux/build/Meltype-Rust-linux.tar.gz
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./rust/build-windows.ps1 -WithTip -NativeOnly
      - name: Rust TSF COM objects and native provider delegation
        if: runner.os == 'Windows'
        run: python rust/native/tests/tsf_com_smoke.py target/x86_64-pc-windows-msvc/release/meltype_native.dll native/tip/bin/rust-x64/MeltypeTip.dll
      - name: Rust TSF edit-session scheduling and captured shell actions
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python rust/native/tests/tsf_edit_session_smoke.py target/x86_64-pc-windows-msvc/release/meltype_native.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/native/tests/tsf_range_smoke.py target/x86_64-pc-windows-msvc/release/meltype_native.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/native/tests/tsf_composition_smoke.py target/x86_64-pc-windows-msvc/release/meltype_native.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/native/tests/tsf_commit_smoke.py target/x86_64-pc-windows-msvc/release/meltype_native.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/native/tests/tsf_recovery_smoke.py target/x86_64-pc-windows-msvc/release/meltype_native.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/native/tests/tsf_abandoned_smoke.py target/x86_64-pc-windows-msvc/release/meltype_native.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/native/tests/tsf_fields_smoke.py target/x86_64-pc-windows-msvc/release/meltype_native.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./rust/native/tests/build-edit-session-host.ps1
      - name: Build test-only upstream candidate renderer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./rust/native/tests/build-reference-candidates.ps1
      - name: Rust candidate HWND behavior and upstream rendering parity
        if: runner.os == 'Windows'
        env:
          MELTYPE_CANDIDATE_PREVIEW: dist/candidate-preview-x64
        run: |
          python rust/native/tests/tsf_candidate_smoke.py target/x86_64-pc-windows-msvc/release/meltype_native.dll dist/candidate-reference/reference-x64.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/native/tests/tsf_candidate_view_smoke.py target/x86_64-pc-windows-msvc/release/meltype_native.dll dist/candidate-reference/reference-x64.dll
      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with:
          python-version: '3.12'
          architecture: 'x86'
      - name: Rust TSF COM calling conventions in a 32-bit process
        if: runner.os == 'Windows'
        run: python rust/native/tests/tsf_com_smoke.py target/i686-pc-windows-msvc/release/meltype_native.dll native/tip/bin/rust-x86/MeltypeTip.dll
      - name: Rust TSF edit-session scheduling in a 32-bit process
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python rust/native/tests/tsf_edit_session_smoke.py target/i686-pc-windows-msvc/release/meltype_native.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/native/tests/tsf_range_smoke.py target/i686-pc-windows-msvc/release/meltype_native.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/native/tests/tsf_composition_smoke.py target/i686-pc-windows-msvc/release/meltype_native.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/native/tests/tsf_commit_smoke.py target/i686-pc-windows-msvc/release/meltype_native.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/native/tests/tsf_recovery_smoke.py target/i686-pc-windows-msvc/release/meltype_native.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/native/tests/tsf_abandoned_smoke.py target/i686-pc-windows-msvc/release/meltype_native.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/native/tests/tsf_fields_smoke.py target/i686-pc-windows-msvc/release/meltype_native.dll
      - name: Rust candidate HWND behavior and rendering in a 32-bit process
        if: runner.os == 'Windows'
        env:
          MELTYPE_CANDIDATE_PREVIEW: dist/candidate-preview-x86
        run: |
          python rust/native/tests/tsf_candidate_smoke.py target/i686-pc-windows-msvc/release/meltype_native.dll dist/candidate-reference/reference-x86.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/native/tests/tsf_candidate_view_smoke.py target/i686-pc-windows-msvc/release/meltype_native.dll dist/candidate-reference/reference-x86.dll
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: rust-TSF-candidate-previews
          path: dist/candidate-preview-*/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: rust-${{ runner.os }}
          path: |
            target/release/meltype-rs*
            target/release/meltype-settings*
            target/release/*meltype_native.*
            native/tip/bin/rust-*/
            LICENSE
            THIRD-PARTY-NOTICES.md
            rust/README.md
            quality-report.json
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
      - run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Build JNI libraries
        env:
          CARGO_NDK_PLATFORM: '26'
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          export ANDROID_NDK="$ANDROID_NDK_HOME"
          cargo ndk -t arm64-v8a -t x86_64 -o android/app/src/main/jniLibs build -p meltype-native --release --locked
      - run: gradle -p android assembleDebug lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: meltype-rust-android-debug
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/lint-results-debug.html
            LICENSE
            THIRD-PARTY-NOTICES.md
