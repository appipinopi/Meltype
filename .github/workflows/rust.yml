name: Rust preview
on:
  workflow_dispatch:
  push:
    branches: [codex/rust-cross-platform]
    paths: ['rust/**', 'android/**', 'Cargo.*', 'dictionaries/**', 'native/tip/**', '.github/workflows/rust.yml']
  pull_request:
    paths: ['rust/**', 'android/**', 'Cargo.*', 'dictionaries/**', 'native/tip/**', '.github/workflows/rust.yml']
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --release --locked
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./rust/build-windows.ps1 -WithTip
      - uses: actions/upload-artifact@v4
        with:
          name: rust-${{ runner.os }}
          path: |
            target/release/meltype-rs*
            target/release/*meltype_native.*
            native/tip/bin/rust-*/
            LICENSE
            THIRD-PARTY-NOTICES.md
            rust/README.md
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
      - run: cargo install cargo-ndk --locked
      - name: Build JNI libraries
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: cargo ndk -t arm64-v8a -t x86_64 -p 26 -o android/app/src/main/jniLibs build -p meltype-native --release --locked
      - run: gradle -p android assembleDebug lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: meltype-rust-android-debug
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/lint-results-debug.html
            LICENSE
            THIRD-PARTY-NOTICES.md
