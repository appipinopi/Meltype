name: Flash identity guard
on:
  push:
    branches: [rust, main]
  pull_request:
    branches: [rust, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: flash-identity-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    name: Flash identity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/check-flash-identity.py
      - run: python -m unittest discover -s tools -p test_flash_identity.py -v
