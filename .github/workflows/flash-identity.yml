name: Flash identity guard
on:
  push:
    branches: [rust]
  pull_request:
    branches: [rust]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Flash identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/check-flash-identity.py
      - run: python -m unittest discover -s tools -p test_flash_identity.py -v
