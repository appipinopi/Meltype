[package]
name = "meltype-settings"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
visual-test = ["eframe/__screenshot"]

[dependencies]
meltype-core.workspace = true
serde_json.workspace = true
eframe = { version = "=0.31.1", default-features = false, features = ["glow", "default_fonts", "x11", "wayland", "accesskit"] }
rfd = "=0.17.2"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "=0.26.1", default-features = false }
ab_glyph = "0.2"
fs2 = "0.4"
