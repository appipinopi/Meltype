[package]
name = "meltype-native"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "meltype_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
meltype-core.workspace = true
serde_json.workspace = true
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.58.0", features = [
    "Foundation_Numerics", "Win32_Foundation", "Win32_UI_TextServices",
    "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_Graphics_Gdi",
    "Win32_System_Registry", "Win32_System_Ole", "Win32_System_Com", "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Dwm", "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_Security", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_JobObjects",
] }
serde.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
