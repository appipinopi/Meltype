[package]
name = "meltype-native"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "meltype_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
meltype-core.workspace = true
serde_json.workspace = true
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.58.0", features = ["Win32_Foundation", "Win32_UI_TextServices"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
